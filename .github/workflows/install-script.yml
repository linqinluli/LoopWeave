name: Install Script

on:
  push:
    branches: [main, dev/**, feature/**]
    paths:
      - 'scripts/install.sh'
      - '.github/workflows/install-script.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/install.sh'
      - '.github/workflows/install-script.yml'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  test-install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    # Backstop so a blocking step (e.g. `loopweave launch`) can't hang for the
    # default 6h job timeout. Normal runs finish in ~3-4 min.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test install script syntax
        run: bash -n scripts/install.sh

      - name: Test install script help
        run: bash scripts/install.sh --help

      - name: Run install script (local source)
        run: |
          bash scripts/install.sh --local-source "$GITHUB_WORKSPACE"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Verify loopweave command exists
        run: |
          export PATH="${LOOPWEAVE_HOME}/bin:$PATH"
          which loopweave
          loopweave --help
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Verify loopweave version
        run: |
          export PATH="${LOOPWEAVE_HOME}/bin:$PATH"
          loopweave version
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Verify Python environment
        run: |
          test -f "${LOOPWEAVE_HOME}/venv/bin/python"
          "${LOOPWEAVE_HOME}/venv/bin/python" -c "import loopweave; print('loopweave imported successfully')"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Test loopweave launch --help
        run: |
          export PATH="${LOOPWEAVE_HOME}/bin:$PATH"
          loopweave launch --help
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Test loopweave launch requires config
        run: |
          export PATH="${LOOPWEAVE_HOME}/bin:$PATH"
          # Should fail with config error when no config provided
          if loopweave launch 2>&1; then
            echo "Expected loopweave launch to fail without config"
            exit 1
          fi
          # Verify error message mentions config
          loopweave launch 2>&1 | grep -qi "config"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Test loopweave launch with config file
        run: |
          export PATH="${LOOPWEAVE_HOME}/bin:$PATH"
          # Create a minimal config file
          cat > "${LOOPWEAVE_HOME}/configs/loopweave_config.yaml" << 'EOF'
          model_owner: test
          supported_models:
            - model_name: test-model
              model_path: /nonexistent/path
              max_model_len: 1024
          authorized_users:
            test-key: test-user
          EOF
          # `loopweave launch` is a blocking uvicorn server: with a valid config it
          # passes validation and serves (models load lazily, so a bad
          # model_path does NOT make it exit). Run it in the background and stop
          # it after it has had time to start, so CI can't hang on the server.
          # Portable (no `timeout`, which isn't on macOS): we just smoke-test
          # that launch accepts the config and starts up.
          loopweave launch > launch.log 2>&1 &
          launch_pid=$!
          sleep 60
          if kill -0 "$launch_pid" 2>/dev/null; then
            echo "OK: loopweave launch is still serving after startup (config validation passed)"
          else
            echo "loopweave launch exited on its own within 60s; output:"
            cat launch.log
          fi
          # Stop the server and its children. SIGKILL is uncatchable, and we
          # deliberately do NOT `wait` (the server ignores SIGTERM), so this
          # never blocks the job.
          pkill -KILL -P "$launch_pid" 2>/dev/null || true
          kill -KILL "$launch_pid" 2>/dev/null || true
          # Fail only if launch never accepted the provided config file.
          if grep -q "Configuration file must be provided" launch.log; then
            echo "FAIL: loopweave launch did not pick up the provided config"
            exit 1
          fi
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Clean up installation
        run: rm -rf "${LOOPWEAVE_HOME}"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

  test-backend-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run install script
        run: |
          bash scripts/install.sh --local-source "$GITHUB_WORKSPACE"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Verify backend dependencies installed
        run: |
          "${LOOPWEAVE_HOME}/venv/bin/python" -c "import peft; print('peft imported successfully')"
          "${LOOPWEAVE_HOME}/venv/bin/python" -c "import redis; print('redis imported successfully')"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Clean up installation
        run: rm -rf "${LOOPWEAVE_HOME}"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

  test-wrapper-commands:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install loopweave
        run: bash scripts/install.sh --local-source "$GITHUB_WORKSPACE"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Test help command
        run: |
          export PATH="${LOOPWEAVE_HOME}/bin:$PATH"
          loopweave help
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Test version command
        run: |
          export PATH="${LOOPWEAVE_HOME}/bin:$PATH"
          loopweave version
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Test upgrade command (from PyPI)
        run: |
          export PATH="${LOOPWEAVE_HOME}/bin:$PATH"
          # Prove an installed wrapper refreshes a stale pin before resolving.
          printf '%s\n' 'verl==0.8.0' > "${LOOPWEAVE_HOME}/scripts/verl-git-override.txt"
          export LOOPWEAVE_VERL_OVERRIDE_URL="file://${GITHUB_WORKSPACE}/scripts/verl-git-override.txt"
          loopweave upgrade
          cmp scripts/verl-git-override.txt "${LOOPWEAVE_HOME}/scripts/verl-git-override.txt"
          "${LOOPWEAVE_HOME}/venv/bin/python" -c \
            "from importlib.metadata import version; assert version('loopweave') == '0.1.8'"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Test upgrade command (from local source)
        run: |
          export PATH="${LOOPWEAVE_HOME}/bin:$PATH"
          loopweave upgrade --local-source "$GITHUB_WORKSPACE"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Clean up installation
        run: rm -rf "${LOOPWEAVE_HOME}"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

  test-clean-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initial install
        run: |
          bash scripts/install.sh --local-source "$GITHUB_WORKSPACE"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Create marker file to verify clean
        run: |
          echo "marker" > "${LOOPWEAVE_HOME}/marker.txt"
          test -f "${LOOPWEAVE_HOME}/marker.txt"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Reinstall with --clean
        run: |
          bash scripts/install.sh --local-source "$GITHUB_WORKSPACE" --clean
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Verify marker file was removed
        run: |
          # Marker file should be gone after --clean
          test ! -f "${LOOPWEAVE_HOME}/marker.txt"
          # But loopweave should still be installed
          "${LOOPWEAVE_HOME}/venv/bin/python" -c "import loopweave; print('loopweave imported successfully')"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Clean up installation
        run: rm -rf "${LOOPWEAVE_HOME}"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

  test-upgrade-from-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install loopweave
        run: bash scripts/install.sh --local-source "$GITHUB_WORKSPACE"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Test upgrade --from-source (real git path against this checkout)
        run: |
          export PATH="${LOOPWEAVE_HOME}/bin:$PATH"
          # Exercise the real VCS clone+build+resolve path (not --local-source),
          # pointed at this checkout's git. Pin the exact commit ($GITHUB_SHA):
          # a bare file:// repo has no origin/HEAD, so uv cannot infer a default
          # branch and fails without an explicit rev.
          export LOOPWEAVE_GIT_URL="file://$GITHUB_WORKSPACE@$GITHUB_SHA"
          loopweave upgrade --from-source
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Verify loopweave still works after upgrade
        run: |
          export PATH="${LOOPWEAVE_HOME}/bin:$PATH"
          loopweave version
          loopweave launch --help
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave

      - name: Clean up installation
        run: rm -rf "${LOOPWEAVE_HOME}"
        env:
          LOOPWEAVE_HOME: ${{ runner.temp }}/loopweave
